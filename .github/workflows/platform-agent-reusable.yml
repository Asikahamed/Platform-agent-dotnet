name: Platform Agent Reusable Workflow

on:
  workflow_call:

    inputs:

      app_repository:
        description: Application repository (owner/repo)
        required: true
        type: string

      app_branch:
        description: Branch to analyze
        required: false
        default: main
        type: string

    secrets:

      GH_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:

################################################################################
# Checkout Repositories
################################################################################

  checkout:

    runs-on: ubuntu-latest

    outputs:
      app_home: ${{ steps.paths.outputs.app_home }}
      platform_home: ${{ steps.paths.outputs.platform_home }}

    steps:

      ##############################################################
      # Checkout Application Repository
      ##############################################################

      - name: Checkout Application Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_branch }}
          token: ${{ secrets.GH_TOKEN }}
          path: application
          fetch-depth: 0

      ##############################################################
      # Checkout Platform Repository
      ##############################################################

      - name: Checkout Platform Repository
        uses: actions/checkout@v4
        with:
          repository: Asikahamed/Platform-agent-dotnet
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: platform

      ##############################################################
      # Export Paths
      ##############################################################

      - id: paths
        run: |

          echo "app_home=$GITHUB_WORKSPACE/application" >> $GITHUB_OUTPUT

          echo "platform_home=$GITHUB_WORKSPACE/platform" >> $GITHUB_OUTPUT

################################################################################
# Analyze Repository
################################################################################

  analyze:

    name: Analyze Repository

    runs-on: ubuntu-latest

    outputs:

      app_path: ${{ steps.analysis.outputs.app_path }}

      language: ${{ steps.analysis.outputs.language }}

      build_tool: ${{ steps.analysis.outputs.build_tool }}

      framework: ${{ steps.analysis.outputs.framework }}

      dotnet_version: ${{ steps.analysis.outputs.dotnet_version }}

      deployment_target: ${{ steps.analysis.outputs.deployment_target }}

      solution_file: ${{ steps.analysis.outputs.solution_file }}

      application_project: ${{ steps.analysis.outputs.application_project }}

      application_dll: ${{ steps.analysis.outputs.application_dll }}

      has_dockerfile: ${{ steps.analysis.outputs.has_dockerfile }}

      has_terraform: ${{ steps.analysis.outputs.has_terraform }}

      has_workflows: ${{ steps.analysis.outputs.has_workflows }}

    steps:

      ############################################################
      # Checkout Application Repository
      ############################################################

      - name: Checkout Application Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_branch }}
          token: ${{ secrets.GH_TOKEN }}
          path: application

      - name: Debug - Application Repository
        run: |
          echo "Current Directory"
          pwd

          echo ""
          echo "Application Home"
          echo "$APP_HOME"

          echo ""
          echo "Repository Structure"
          ls -la
          find . -maxdepth 4
        working-directory: application

      ############################################################
      # Checkout Platform Repository
      ############################################################

      - name: Checkout Platform Repository
        uses: actions/checkout@v4
        with:
          repository: Asikahamed/Platform-agent-dotnet
          path: platform
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - name: Debug Environment
        run: |
          echo "APP_HOME=$APP_HOME"
          echo "PLATFORM_HOME=$PLATFORM_HOME"

      - name: Debug Current Directory
        run: |
          pwd
          ls -la
          
      ############################################################
      # Analyze
      ############################################################
      - name: Debug Environment
        env:
          APP_HOME: ${{ github.workspace }}/application
          PLATFORM_HOME: ${{ github.workspace }}/platform
        run: |

          echo "Workspace:"
          pwd

          echo ""
          echo "APP_HOME=$APP_HOME"
          echo "PLATFORM_HOME=$PLATFORM_HOME"

          echo ""
          echo "Application repository"
          find "$APP_HOME" -maxdepth 3

          echo ""
          echo "Platform repository"
          find "$PLATFORM_HOME/scripts" -maxdepth 2

          echo ""
          echo "dirname usages"
          grep -n "dirname" "$PLATFORM_HOME/scripts/analysis/analyze.sh"

          echo ""
          echo "First 80 lines of analyze.sh"
          sed -n '1,80p' "$PLATFORM_HOME/scripts/analysis/analyze.sh"
          
      - name: Analyze Repository
        id: analysis
        env:
          APP_HOME: ${{ github.workspace }}/application
          PLATFORM_HOME: ${{ github.workspace }}/platform
        run: |

          chmod +x "$PLATFORM_HOME/scripts/analysis/analyze.sh"

          cd "$APP_HOME"

          bash -x "$PLATFORM_HOME/scripts/analysis/analyze.sh"
        

################################################################################
# Load Agents
################################################################################

  load-agents:

    runs-on: ubuntu-latest

    needs:
      - checkout
      - analyze

    outputs:

      docker_agent: ${{ steps.load.outputs.docker_agent }}

      terraform_agent: ${{ steps.load.outputs.terraform_agent }}

      cicd_agent: ${{ steps.load.outputs.cicd_agent }}

      kubernetes_agent: ${{ steps.load.outputs.kubernetes_agent }}

    steps:

      ############################################################
      # Checkout Application Repository
      ############################################################

      - name: Checkout Application Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_branch }}
          token: ${{ secrets.GH_TOKEN }}
          path: application

      ############################################################
      # Checkout Platform Repository
      ############################################################

      - name: Checkout Platform Repository
        uses: actions/checkout@v4
        with:
          repository: Asikahamed/Platform-agent-dotnet
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: platform


      ############################################################
      # Load Agent Prompts
      ############################################################

      - name: Verify Script Being Executed
        env:
          PLATFORM_HOME: ${{ github.workspace }}/platform
        run: |
          echo "===== SCRIPT CONTENT ====="
          sed -n '1,40p' "$PLATFORM_HOME/scripts/agents/load-agents.sh"
      
          echo ""
          echo "===== PLATFORM TREE ====="
          find "$PLATFORM_HOME" -maxdepth 3 | sort
          
      - name: Load Agent Prompts
        id: load
        env:
          PLATFORM_HOME: ${{ github.workspace }}/platform

        run: |

          chmod +x "$PLATFORM_HOME/scripts/agents/load-agents.sh"

          "$PLATFORM_HOME/scripts/agents/load-agents.sh"


################################################################################
# Decision Engine
################################################################################

  decision-engine:

    runs-on: ubuntu-latest

    needs:
      - checkout
      - analyze
      - load-agents

    outputs:
      docker_template: ${{ steps.decision.outputs.docker_template }}
      terraform_template: ${{ steps.decision.outputs.terraform_template }}
      cicd_template: ${{ steps.decision.outputs.cicd_template }}

    steps:
      ############################################################
      # Checkout Application Repository
      ############################################################

      - name: Checkout Application Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_branch }}
          token: ${{ secrets.GH_TOKEN }}
          path: application

      ############################################################
      # Checkout Platform Repository
      ############################################################

      - name: Checkout Platform Repository
        uses: actions/checkout@v4
        with:
          repository: Asikahamed/Platform-agent-dotnet
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: platform

      - name: Decision Engine
        id: decision

        env:
          PLATFORM_HOME: ${{ github.workspace }}/platform

          LANGUAGE: ${{ needs.analyze.outputs.language }}
          BUILD_TOOL: ${{ needs.analyze.outputs.build_tool }}
          FRAMEWORK: ${{ needs.analyze.outputs.framework }}
          DOTNET_VERSION: ${{ needs.analyze.outputs.dotnet_version }}
          APPLICATION_PROJECT: ${{ needs.analyze.outputs.application_project }}
          SOLUTION_FILE: ${{ needs.analyze.outputs.solution_file }}
          APPLICATION_DLL: ${{ needs.analyze.outputs.application_dll }}
          DEPLOYMENT_TARGET: ${{ needs.analyze.outputs.deployment_target }}

        run: |

          chmod +x \
            "$PLATFORM_HOME/scripts/agents/decision-engine.sh"

          "$PLATFORM_HOME/scripts/agents/decision-engine.sh"

################################################################################
# Generate Assets
################################################################################

  generate-assets:

    runs-on: ubuntu-latest

    needs:
      - checkout
      - analyze
      - decision-engine

    outputs:
      changes: ${{ steps.git.outputs.changes }}
      branch_name: ${{ steps.git.outputs.branch_name }}

    steps:

      ############################################################
      # Checkout Application Repository
      ############################################################

      - name: Checkout Application Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_branch }}
          token: ${{ secrets.GH_TOKEN }}
          path: application
          fetch-depth: 0

      ############################################################
      # Checkout Platform Repository
      ############################################################

      - name: Checkout Platform Repository
        uses: actions/checkout@v4
        with:
          repository: Asikahamed/Platform-agent-dotnet
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: platform

      ############################################################
      # Generate DevOps Assets
      ############################################################

      - name: Generate Assets

        env:

          APP_HOME: ${{ github.workspace }}/application
          PLATFORM_HOME: ${{ github.workspace }}/platform

          APP_PATH: ${{ needs.analyze.outputs.app_path }}

          LANGUAGE: ${{ needs.analyze.outputs.language }}

          BUILD_TOOL: ${{ needs.analyze.outputs.build_tool }}

          FRAMEWORK: ${{ needs.analyze.outputs.framework }}

          DOTNET_VERSION: ${{ needs.analyze.outputs.dotnet_version }}

          SOLUTION_FILE: ${{ needs.analyze.outputs.solution_file }}

          APPLICATION_PROJECT: ${{ needs.analyze.outputs.application_project }}

          APPLICATION_DLL: ${{ needs.analyze.outputs.application_dll }}

          DEPLOYMENT_TARGET: ${{ needs.analyze.outputs.deployment_target }}

          HAS_DOCKERFILE: ${{ needs.analyze.outputs.has_dockerfile }}
          HAS_TERRAFORM: ${{ needs.analyze.outputs.has_terraform }}
          HAS_WORKFLOWS: ${{ needs.analyze.outputs.has_workflows }}

          DOCKER_TEMPLATE: ${{ needs.decision-engine.outputs.docker_template }}
          TERRAFORM_TEMPLATE: ${{ needs.decision-engine.outputs.terraform_template }}
          CICD_TEMPLATE: ${{ needs.decision-engine.outputs.cicd_template }}

        run: |

          chmod +x \
            "$PLATFORM_HOME/scripts/generator/generate-assets.sh"

          "$PLATFORM_HOME/scripts/generator/generate-assets.sh"

      ############################################################
      # Git Operations
      ############################################################

      - name: Git Operations
        id: git

        env:

          APP_HOME: ${{ github.workspace }}/application
          PLATFORM_HOME: ${{ github.workspace }}/platform

        run: |

          chmod +x \
            "$PLATFORM_HOME/scripts/git/git.sh"

          cd "$APP_HOME"

          "$PLATFORM_HOME/scripts/git/git.sh"

  ################################################################################
# Create Pull Request
################################################################################

  create-pr:

    if: needs.generate-assets.outputs.changes == 'true'

    runs-on: ubuntu-latest

    needs:
      - checkout
      - generate-assets

    steps:

      ############################################################
      # Checkout Application Repository
      ############################################################

      - name: Checkout Application Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ needs.generate-assets.outputs.branch_name }}
          token: ${{ secrets.GH_TOKEN }}
          path: application
          fetch-depth: 0

      ############################################################
      # Checkout Platform Repository
      ############################################################

      - name: Checkout Platform Repository
        uses: actions/checkout@v4
        with:
          repository: Asikahamed/Platform-agent-dotnet
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: platform

      ############################################################
      # Create Pull Request
      ############################################################

      - name: Create Pull Request

        env:

          PLATFORM_HOME: ${{ github.workspace }}/platform

          APP_HOME: ${{ github.workspace }}/application

          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          GITHUB_REPOSITORY: ${{ inputs.app_repository }}

          BRANCH_NAME: ${{ needs.generate-assets.outputs.branch_name }}

          CHANGES: ${{ needs.generate-assets.outputs.changes }}

        run: |

          chmod +x \
            "$PLATFORM_HOME/scripts/git/create-pr.sh"

          "$PLATFORM_HOME/scripts/git/create-pr.sh"

  
  ################################################################################
# Review
################################################################################

  review:

    runs-on: ubuntu-latest

    needs:
      - checkout
      - analyze
      - decision-engine
      - generate-assets

    if: always()

    steps:

      ############################################################
      # Checkout Application Repository
      ############################################################

      - name: Checkout Application Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_branch }}
          token: ${{ secrets.GH_TOKEN }}
          path: application

      ############################################################
      # Checkout Platform Repository
      ############################################################

      - name: Checkout Platform Repository
        uses: actions/checkout@v4
        with:
          repository: Asikahamed/Platform-agent-dotnet
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: platform

      ############################################################
      # Platform Review
      ############################################################

      - name: Platform Review

        env:

          PLATFORM_HOME: ${{ github.workspace }}/platform

          APP_HOME: ${{ github.workspace }}/application

          LANGUAGE: ${{ needs.analyze.outputs.language }}

          FRAMEWORK: ${{ needs.analyze.outputs.framework }}

          BUILD_TOOL: ${{ needs.analyze.outputs.build_tool }}

          DOTNET_VERSION: ${{ needs.analyze.outputs.dotnet_version }}

          VERSION_NAME: ".NET Version"

          VERSION_VALUE: ${{ needs.analyze.outputs.dotnet_version }}

          SOLUTION_FILE: ${{ needs.analyze.outputs.solution_file }}

          APPLICATION_PROJECT: ${{ needs.analyze.outputs.application_project }}

          APPLICATION_DLL: ${{ needs.analyze.outputs.application_dll }}

          DEPLOYMENT_TARGET: ${{ needs.analyze.outputs.deployment_target }}
          

          DOCKER_TEMPLATE: ${{ needs.decision-engine.outputs.docker_template }}

          TERRAFORM_TEMPLATE: ${{ needs.decision-engine.outputs.terraform_template }}

          CICD_TEMPLATE: ${{ needs.decision-engine.outputs.cicd_template }}

          BRANCH_NAME: ${{ needs.generate-assets.outputs.branch_name }}

          CHANGES: ${{ needs.generate-assets.outputs.changes }}

        run: |

          chmod +x \
            "$PLATFORM_HOME/scripts/review/review.sh"

          "$PLATFORM_HOME/scripts/review/review.sh"
